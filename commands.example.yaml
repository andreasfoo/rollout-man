# The runner's commands, kept apart from any submission on purpose.
#
# Point rollout-man at this file with --commands and it becomes the only place
# commands may come from; a submission that declares its own is refused rather
# than merged. That is the boundary that matters: a submitter chooses which
# steps run (`using: ship`), the operator chooses what a step *is*.
#
#   rollout-man run experiment.yaml --commands commands.example.yaml
#
# On a machine where you write both halves yourself, keeping them in one file
# is fine -- the boundary is worth drawing when the two people differ.
---
kind: Commands
timeout: 120m
max_attempts: 3

# inherit_env: false stops every command from seeing every credential on the
# machine. Each one then declares the names it actually needs.
inherit_env: false

# uses: + sha256: is the pin. If the file on disk stops matching, the run is
# refused -- a warning nobody reads is not a control.
harbor:
  uses: adapters/harbor.sh
  sha256: d822f0cf2ea49988a32766b479ee679d5869272b38e2b466fe7c756a81bfb04f
  env: [DOCKER_HOST, ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY]

ship:
  uses: adapters/ship-github.sh
  sha256: 61b73aac154b7246d2cb12be1baafee0b4c759ac362f274816f6e657b9e0e749
  env: [SHIP_REPO, SHIP_BRANCH, SSH_AUTH_SOCK, GIT_AUTHOR_NAME, GIT_AUTHOR_EMAIL, GIT_COMMITTER_NAME, GIT_COMMITTER_EMAIL]

source_git:
  script: |
    set -euo pipefail
    git clone --quiet --depth 1 --branch "${GIT_REF}" "${GIT_REPO}" "${LOCAL_PATH}"

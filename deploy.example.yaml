# Deployment config for `rollout-man worker start --config deploy.example.yaml`.
# Only kind: Commands is read here; experiments carry their own LLMSpecs.
---
kind: Commands
timeout: 30m
max_attempts: 3

storage_upload:
  run: ["rclone", "copyto", "--", "{{.LocalPath}}", "onedrive:rollout-man/{{.Key}}"]

storage_download:
  run: ["rclone", "copyto", "--", "onedrive:rollout-man/{{.Key}}", "{{.LocalPath}}"]

storage_link:
  run: ["rclone", "link", "--expire", "24h", "--", "onedrive:rollout-man/{{.Key}}"]

storage_delete:
  run: ["rclone", "deletefile", "--", "onedrive:rollout-man/{{.Key}}"]

source_git:
  script: |
    set -euo pipefail
    git clone --quiet --depth 1 --branch "${GIT_REF}" "${GIT_REPO}" "${LOCAL_PATH}"

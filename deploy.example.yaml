# Commands the runtime shells out to. Keep them next to the experiment or in a
# file of their own; rollout-man reads the kind: Commands document from either.
---
kind: Commands
timeout: 30m
max_attempts: 3

# How a trial actually runs. Building the case image, starting it, running the
# agent inside it and running the verifier all belong to Harbor -- rollout-man
# only asks for a number and reads the answer back out of $OUT_DIR.
#
#   in   CASE_DIR OUT_DIR TRIAL_ID AGENT_KIND AGENT_NAME AGENT_COMMAND
#        AGENT_USER VERIFIER_USER AGENT_TIMEOUT_SEC VERIFIER_TIMEOUT_SEC
#        BUILD_TIMEOUT_SEC CPUS MEMORY_MB STORAGE_MB GPUS ALLOW_INTERNET
#        LLM_BASE_URL LLM_MODEL LLM_API_KEY
#   out  $OUT_DIR/reward.txt   the score -- the only thing that means "measured"
#        $OUT_DIR/failure.txt  first line a failure code, rest an explanation
#        $OUT_DIR/*            artifacts to keep (traj.jsonl, agent.log, ...)
#
# Exit non-zero without failure.txt and the trial is ENV_FAILED: "could not
# measure" is ours, and it must never land in the agent's denominator.
#
# adapters/harbor.sh is a working implementation over `harbor run`. It maps
# Harbor's exception types onto the taxonomy and lets Harbor enforce every
# timeout and resource limit the case's task.toml declares.
harbor:
  script: adapters/harbor.sh

source_git:
  script: |
    set -euo pipefail
    git clone --quiet --depth 1 --branch "${GIT_REF}" "${GIT_REPO}" "${LOCAL_PATH}"

# {{.LocalPath}} is the run directory, {{.Key}} the destination from
# pipeline.per_experiment.ship.dest
ship:
  run: ["rclone", "copyto", "--", "{{.LocalPath}}", "onedrive:{{.Key}}"]

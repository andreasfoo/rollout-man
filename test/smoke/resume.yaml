# One deliberately slow trial, so the run can be interrupted mid-agent.
---
kind: Commands
timeout: 5m
max_attempts: 1

---
kind: Experiment
name: resume

case_defaults:
  source: local

cases:
  - path: test/smoke/slow-case

matrix:
  # Two rollouts of a deterministic agent, on purpose: this test needs a second
  # trial to be interrupted during, and the identical result is the point --
  # resuming must not re-run the first one. Deterministic agents run once by
  # default, so it says so explicitly rather than relying on the old behaviour.
  agents:
    - name: oracle
      trials: 2
  trials: 2

concurrency: 1
max_attempts: 1

pipeline:
  per_case:
    - uses: admission
      with: {require: any}
  per_trial:
    - uses: local
    - uses: redact
      with: {keys: required, ips: {traj: true, logs: false}}

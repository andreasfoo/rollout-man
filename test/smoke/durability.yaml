---
kind: Commands
timeout: 5m
max_attempts: 2
storage_upload:
  script: |
    set -euo pipefail
    dst="${ROLLOUT_MAN_BUCKET:-/tmp/rm-bucket-t}/${KEY}"
    mkdir -p "$(dirname "$dst")"; cp -- "${LOCAL_PATH}" "$dst"

---
kind: Experiment
name: durability

case_defaults:
  source: local

cases:
  - path: test/smoke/slow-case

matrix:
  agents:
    - name: oracle
  trials: 1

concurrency: 1

pipeline:
  per_case:
    - step: resolve
  per_trial:
    - step: redact
      keys: required
      ips: {traj: true, logs: false}
    - step: bundle
      format: tar.zst
      include: [traj, logs, result]
    - step: upload
      using: storage_upload
      dest: "evals/{{.ExperimentName}}/{{.TrialID}}/"
      objects: [bundle, result]
  per_experiment:
    - step: report

retry_policy:
  max_total_attempts: 2

# Smoke test: synthetic cases, local executor, filesystem "shipping".
---
kind: Commands
timeout: 5m
max_attempts: 2

ship:
  script: |
    set -euo pipefail
    dst="${ROLLOUT_MAN_BUCKET:-/tmp/rm-bucket}/${KEY}"
    mkdir -p "$dst"
    cp -r -- "${LOCAL_PATH}/." "$dst/"

source_git:
  script: |
    set -euo pipefail
    git clone --quiet --depth 1 --branch "${GIT_REF}" "${GIT_REPO}" "${LOCAL_PATH}"

# A "real agent" is just another command. This one deliberately leaks its key
# and an internal IP so the smoke test can prove the redaction tiers work.
agent_leaky:
  script: |
    set -euo pipefail
    printf 'ROLLOUT-MAN-OK' > /app/answer.txt
    mkdir -p /logs/agent
    printf '{"role":"system","text":"calling %s with key %s"}\n' \
      "$LLM_BASE_URL" "$LLM_API_KEY" > /logs/agent/traj.jsonl
    printf '{"role":"tool","text":"connected to 10.1.2.3:8080"}\n' >> /logs/agent/traj.jsonl
    echo "agent.log: used key $LLM_API_KEY against 10.1.2.3" >> /logs/agent/agent.log
    echo "done"

---
kind: LLMSpec
name: fake-prod
provider: smoke
base_url: https://api.example.invalid
model: fake-model-1
api_key_env: SMOKE_API_KEY

---
kind: Experiment
name: smoke

case_defaults:
  source: local

cases:
  - path: test/smoke/pass-case
  - path: test/smoke/leaky-case

matrix:
  agents:
    - name: oracle
    - name: nop
    - name: leaky
      llm_spec: fake-prod
  trials: 2

concurrency: 4
max_attempts: 2

pipeline:
  per_case:
    - uses: admission
      with: {require: admitted, oracle_min_reward: 1.0, nop_max_reward: 0.0, trials: 1}
  per_trial:
    - uses: local
    - uses: redact
      with: {keys: required, ips: {traj: true, logs: false}}
  per_experiment:
    - uses: ship
      with: {using: ship, dest: "evals/{{.Experiment}}/{{.RunID}}"}

# The highest-fidelity check there is: a real Harbor security case, run through
# real Harbor, scored by its own gdb-owned verifier.
#
# Only libaom. The other shipped case (spidermonkey) is equally real but its
# base images are tens of GB, so a machine that cannot hold them cannot measure
# it -- see test/smoke/real-cases.yaml to run both.
---
kind: Commands
timeout: 120m

harbor:
  script: adapters/harbor.sh

---
kind: Experiment
name: libaom

case_defaults:
  source: local

cases:
  - path: test/cases/libaom-cc9e46cb-bug-6491968-t4

matrix:
  agents: [oracle, nop]
  trials: 1

concurrency: 2
max_attempts: 1

pipeline:
  per_case:
    admission:
      require: admitted
      oracle_min_reward: 1.0
      nop_max_reward: 0.0
      trials: 1
  per_trial:
    redact:
      keys: required
      ips: {traj: true, logs: false}

# The two shipped Harbor cases. Their environments are prebuilt ASan images on
# DockerHub, so measuring them needs a Docker daemon; without one the oracle
# cannot score and the admission gate must refuse the case.
---
kind: Commands
timeout: 30m
max_attempts: 1

---
kind: Experiment
name: real-cases

case_defaults:
  source: local

cases:
  - path: test/cases/libaom-cc9e46cb-bug-6491968-t4
  - path: test/cases/spidermonkey-3b7743c-bug-1928645-t4

matrix:
  agents:
    - name: oracle
    - name: nop
  trials: 1

concurrency: 2
max_attempts: 1

pipeline:
  per_case:
    admission:
      require: admitted
      oracle_min_reward: 1.0
      nop_max_reward: 0.0
      trials: 1
  per_trial:
    redact:
      keys: required
      ips: {traj: true, logs: false}

# The two shipped Harbor cases, run through Harbor itself. Their environments
# are prebuilt ASan images on DockerHub, so measuring them needs `harbor` and a
# Docker daemon; without them the oracle cannot score and the admission gate
# must refuse the case rather than emit numbers.
#
# libaom is measurable: its oracle reproduces the ASan heap-buffer-overflow in
# od_ec_dec_refill and scores 1.0. spidermonkey needs tens of GB of base image,
# so a machine that cannot hold them cannot measure it -- and the admission gate
# will refuse the case rather than report the oracle's 0 as a measurement.
# test/smoke/libaom.yaml runs only the first one.
---
kind: Commands
timeout: 120m
max_attempts: 1

harbor:
  script: adapters/harbor.sh

---
kind: Experiment
name: real-cases

case_defaults:
  source: local

cases:
  - path: test/cases/libaom-cc9e46cb-bug-6491968-t4
  - path: test/cases/spidermonkey-3b7743c-bug-1928645-t4

matrix:
  agents:
    - name: oracle
    - name: nop
  trials: 1

concurrency: 2
max_attempts: 1

pipeline:
  per_case:
    admission:
      require: admitted
      oracle_min_reward: 1.0
      nop_max_reward: 0.0
      trials: 1
  per_trial:
    redact:
      keys: required
      ips: {traj: true, logs: false}

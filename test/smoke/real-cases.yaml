# The two shipped Harbor cases. These need a Docker daemon: their environments
# are prebuilt ASan images on DockerHub. Included so `case resolve` and the
# admission gate can be exercised against real task.toml metadata.
---
kind: Commands
timeout: 30m
max_attempts: 2
storage_upload:
  script: |
    set -euo pipefail
    dst="${ROLLOUT_MAN_BUCKET:-/tmp/rollout-man/bucket}/${KEY}"
    mkdir -p "$(dirname "$dst")"; cp -- "${LOCAL_PATH}" "$dst"

---
kind: Experiment
name: real-cases

case_defaults:
  source: local

cases:
  - path: test/cases/libaom-cc9e46cb-bug-6491968-t4
  - path: test/cases/spidermonkey-3b7743c-bug-1928645-t4

matrix:
  agents:
    - name: oracle
    - name: nop
  trials: 1

concurrency: 2

pipeline:
  per_case:
    - step: resolve
    - step: admission
      require: admitted
      auto_admit: true
      criteria:
        oracle: {min_reward: 1.0}
        nop:    {max_reward: 0.0}
        trials: 1
  per_trial:
    - step: redact
      keys: required
      ips: {traj: true, logs: false}
    - step: bundle
      format: tar.zst
      include: [traj, logs, result]
    - step: upload
      using: storage_upload
      dest: "evals/{{.ExperimentName}}/{{.CasePath}}/{{.TrialID}}/"
  per_experiment:
    - step: report
      formats: [json]

retry_policy:
  max_total_attempts: 1

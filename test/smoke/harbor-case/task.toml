schema_version = "1.2"

[task]
name = "smoke/harbor-case"
description = "Mirrors the Harbor contract the real cases use: the agent leaves a file in /app, the verifier scores it and writes /logs/verifier/reward.txt"

[metadata]
category = "smoke"
difficulty = "trivial"

[agent]
timeout_sec = 120.0
user = "agent"

[verifier]
timeout_sec = 120.0
user = "root"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 512
storage_mb = 1024
gpus = 0
allow_internet = false

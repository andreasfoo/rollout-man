schema_version = "1.2"

[task]
name = "smoke/agent-fail"
description = "Agent exits non-zero: AGENT_FAILED, and it counts against the agent"

[metadata]
category = "smoke"
difficulty = "trivial"

[agent]
timeout_sec = 60.0
user = "agent"

[verifier]
timeout_sec = 60.0
user = "root"

[environment]
build_timeout_sec = 120.0
cpus = 1
memory_mb = 512
storage_mb = 1024
gpus = 0
allow_internet = false

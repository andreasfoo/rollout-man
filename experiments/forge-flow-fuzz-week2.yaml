# Drive every fuzz-harbor task through case-forge's forge-flow-fuzz skill and
# publish only stage2 accepts (strictly reward < 0.6) to cyber-xianjin.
# Cases go to task/week2; Harbor trajectories go to trajectory/<task>/jobs/.
#
# Preconditions:
#   export FORGE_CASES_ROOT=/home/foo/project/casefactory-firefox
#   export FORGE_TASKS_ROOT=/home/foo/project/fuzz-harbor-task/tasks
#   export PROGRESS_FILE=/home/foo/project/casefactory-firefox/FIREFOX-PROGRESS.md
#   export HF_TOKEN=...
#
# `cases:` is a frozen eligibility snapshot, not a glob. It excludes any task
# with a terminal progress/task/casefactory state, all draft-pending-oracle-
# validation tasks (never admit/drive drafts), and cases currently active in
# casefactory. Refresh eligibility from all three state sources before a new
# campaign; rollout-man itself makes resuming a given run idempotent.
---
kind: Commands
timeout: 8h
max_attempts: 1
inherit_env: false

# Per-case pre-check: reject a case whose on-disk footprint exceeds 100MB
# before admission ever spins up a container for it. Cheap and host-only, so
# it runs first -- a case this large (e.g. a full source-tree tarball baked
# into environment/, see spidermonkey-7f081dc-commit-4143afd1-t4 in week1)
# is a packaging mistake worth catching before burning an admission trial on it.
check_case_size:
  env: [PATH, HOME]
  script: |
    set -euo pipefail
    limit_mb=100
    size_bytes=$(du -sb "$CASE_DIR" | cut -f1)
    size_mb=$((size_bytes / 1024 / 1024))
    if [ "$size_mb" -gt "$limit_mb" ]; then
      echo "check_case_size: FAIL $CASE_LABEL -- case is ${size_mb}MB, exceeds ${limit_mb}MB limit" >&2
      exit 1
    fi
    echo "check_case_size: ok $CASE_LABEL -- ${size_mb}MB"

# Ordinary Harbor is used solely by the admission builtin (oracle=1, nop=0).
harbor:
  uses: adapters/harbor.sh
  env: [DOCKER_HOST, PATH, HOME]

# LLM rollout = forge-flow-fuzz's entire stage1 -> stage2 lifecycle.
forge_flow_fuzz:
  uses: adapters/forge-flow-fuzz.sh
  env: [PATH, HOME, DOCKER_HOST, FORGE_CASES_ROOT, FORGE_TASKS_ROOT,
        FORGE_BRIDGE, FORGE_PYTHON, ROLLOUT_MAN_HARBOR_ADAPTER]

materialize_week2:
  uses: adapters/materialize-forge-week2.sh
  env: [PATH, HOME]

# Per-trial materializer: builds this trial's slice of the two HF trees
# inside its own OUT_DIR/materialized/{cases,trajectories}, so the ship steps
# that follow it in per_trial land this trial's data on HF the moment it is
# accepted.
materialize_week2_trial:
  uses: adapters/materialize-forge-week2-trial.sh
  env: [PATH, HOME]

record_progress:
  uses: adapters/record-forge-progress.sh
  env: [PATH, HOME, PROGRESS_FILE]

ship_week2_cases:
  uses: adapters/ship-hf-week2-cases.sh
  env: [HF_TOKEN, HF_HOME, HF_REVISION, HF_PRIVATE, HOME, PATH,
        ROLLOUT_MAN_SHIP_HF_ADAPTER]

ship_week2_trajectories:
  uses: adapters/ship-hf-week2-trajectories.sh
  env: [HF_TOKEN, HF_HOME, HF_REVISION, HF_PRIVATE, HOME, PATH,
        ROLLOUT_MAN_SHIP_HF_ADAPTER]

---
kind: Experiment
name: forge-flow-fuzz-week2

case_defaults:
  source: local

# Replace with the generated full list described above.  One sample is kept so
# `rollout-man cases` can validate this file in a fresh checkout.
cases:
  # Frozen eligibility snapshot (2026-08-24): source task must be keeper or
  # validated; no terminal progress/task/casefactory verdict; no active
  # casefactory operation. Drafts are deliberately excluded: do not admit or
  # drive draft-pending-oracle-validation tasks.
  - path: /home/foo/project/fuzz-harbor-task/tasks/dnsmasq-982faf4-commit-04b0ac0-t4
  - path: /home/foo/project/fuzz-harbor-task/tasks/gstreamer-401f350-commit-0672324-t4
  - path: /home/foo/project/casefactory-firefox/cases/lighttpd-f2b33e7-commit-c42b280-t4
  - path: /home/foo/project/casefactory-firefox/cases/sdl-459e2b0-commit-cb8bf6b-t4
  - path: /home/foo/project/casefactory-firefox/cases/sdl-d04899f-commit-1c5c3b1-t4
  - path: /home/foo/project/fuzz-harbor-task/tasks/strongswan-5645ad2-commit-1f9e4d0-t4
  - path: /home/foo/project/fuzz-harbor-task/tasks/unbound-19473d9-commit-c4e199e-t4

matrix:
  agents:
    - name: forge-flow-fuzz
  trials: 1

# forge-flow-fuzz itself owns an expensive Harbor stage1 + stage2 lifecycle.
# Start conservatively; casefactory memory says four concurrent slots is the
# operating limit, but case-level locks still protect against duplicate work.
concurrency: 4
max_attempts: 1

pipeline:
  concurrency: 2
  per_case:
    # 0. reject an oversized case (packaging mistake) before it ever reaches
    #    admission -- see check_case_size above.
    - uses: check_case_size
      on_failure: skip

    # Gate *before* invoking the skill: a case with a broken oracle or a nop
    # hole is not a valid accept/reject candidate.
    - uses: admission
      with: {oracle_min_reward: 1.0, nop_max_reward: 0.0, trials: 1}

  per_trial:
    - uses: forge_flow_fuzz

    # The adapter maps forge terminal accepted/rejected to 0/1.  The strict
    # comparison is intentional: 0.60 is rejected under historical policy.
    # A rejected case stops here: no redaction, archive, dataset, or upload.
    - uses: guard
      name: terminal-acc-only
      with: {max_reward_exclusive: 0.6, require_measured: true}
      on_violation: drop

    # Only terminal acc artifacts continue. IPs and credentials are scrubbed
    # across every copied case/trial file before either HF upload.
    - uses: redact
      with: {keys: required, ips: {traj: true, logs: true}}

    # This trial's slice of the two trees, inside its own OUT_DIR. Rejected
    # trials never wrote OUT_DIR/case, so the step exits 0 and there is
    # nothing to ship.
    - uses: materialize_week2_trial

    # Separate commits under the requested paths in the same dataset repo --
    # one per accepted trial, so data is visible incrementally rather than
    # after the slowest case in the batch finishes.
    - uses: ship
      with:
        using: ship_week2_cases
        path: "{{steps.materialize_week2_trial.outputs.cases_dir}}"
        dest: tinglydev/cyber-xianjin
    - uses: ship
      with:
        using: ship_week2_trajectories
        path: "{{steps.materialize_week2_trial.outputs.trajectories_dir}}"
        dest: tinglydev/cyber-xianjin

  per_experiment:
    # Append a run-idempotent terminal ledger after successful publication.
    - uses: record_progress

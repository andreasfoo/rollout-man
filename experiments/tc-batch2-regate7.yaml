# Smoke pipeline for tc_batch2: 24 pre-accepted cases → HF publish.
#
# These cases already have accepted verdicts and packaged trajectories (jobs/).
# The forge-flow-fuzz-mock adapter skips the LLM lifecycle entirely and just
# maps the existing jobs/ tree into the trials/ layout, then writes reward=0.0.
# materialize + ship run per trial, inside per_trial -- each accepted trial's
# data is published as soon as that trial finishes, not after the whole batch.
#
# Admission still runs the real oracle and nop via harbor.sh so the gate
# fires normally.
#
# Preconditions:
#   export HF_TOKEN=...
#   export PROGRESS_FILE=<path to a markdown progress doc>   (optional, appended)
#
# Run:
#   go build -o rollout-man ./cmd/rollout-man
#   ./rollout-man run experiments/tc-batch2-smoke.yaml
---
kind: Commands
timeout: 30m
max_attempts: 1
inherit_env: false

# Per-case pre-check 0: reject a case whose on-disk footprint exceeds 100MB
# before admission ever spins up a container for it. Same wording/rationale as
# forge-flow-fuzz-week2.yaml's check_case_size -- a case this large is usually
# a source tarball baked into environment/ (see spidermonkey-7f081dc in week1,
# 97% of the whole dataset), a packaging mistake worth catching cheaply.
check_case_size:
  env: [PATH, HOME]
  script: |
    set -euo pipefail
    limit_mb=100
    size_bytes=$(du -sb "$CASE_DIR" | cut -f1)
    size_mb=$((size_bytes / 1024 / 1024))
    if [ "$size_mb" -gt "$limit_mb" ]; then
      echo "check_case_size: FAIL $CASE_LABEL -- case is ${size_mb}MB, exceeds ${limit_mb}MB limit" >&2
      exit 1
    fi
    echo "check_case_size: ok $CASE_LABEL -- ${size_mb}MB"

# Per-case pre-check 1: task.toml must carry a docker_image field, and the
# case must have a top-level environment/ directory.
# A missing or empty image is a packaging defect that blocks promotion before
# wasting oracle/nop harbor runs. A missing environment/ is a packaging defect
# too: Harbor's Task.is_valid_dir() requires task.toml *and* environment/ to
# recognize `harbor run --path <dir>` as a single task; without it Harbor
# silently falls through to dataset-mode, scans the dir, finds zero tasks, and
# admission dies with "ValueError: Either datasets or tasks must be provided."
# (first seen on dnsmasq-5b99eae-commit-a90f09db-t4, whose Dockerfile/seed/
# tarballs sat at the case root instead of under environment/).
check_toml_image:
  env: [PATH, HOME]
  script: |
    set -euo pipefail
    toml="$CASE_DIR/task.toml"
    [ -f "$toml" ] || { echo "check_toml_image: FAIL -- task.toml not found" >&2; exit 1; }
    if ! grep -qE '^\s*docker_image\s*=' "$toml"; then
      echo "check_toml_image: FAIL $CASE_LABEL -- no docker_image field" >&2; exit 1
    fi
    val=$(grep -E '^\s*docker_image\s*=' "$toml" | head -1 | sed 's/.*=\s*//' | tr -d '"'"'"' ')
    [ -n "$val" ] || { echo "check_toml_image: FAIL $CASE_LABEL -- docker_image is empty" >&2; exit 1; }
    if [ ! -d "$CASE_DIR/environment" ]; then
      echo "check_toml_image: FAIL $CASE_LABEL -- no environment/ directory (harbor run --path" \
        "requires task.toml + environment/ to treat this dir as a single task, otherwise it" \
        "falls through to dataset-mode and admission fails with 'Either datasets or tasks" \
        "must be provided')" >&2
      exit 1
    fi
    # [metadata] status is pipeline-internal lifecycle state (accepted/keeper/
    # draft-pending-oracle-validation/...), not task content -- strip it and
    # write back to the source case dir so it never reaches HF (2026-08-28).
    # Section-aware: only a status= line inside [metadata] is removed.
    if grep -qE '^\s*status\s*=' "$toml"; then
      awk '
        /^[ \t]*\[/ { inmeta = ($0 ~ /^[ \t]*\[metadata\][ \t]*$/) }
        inmeta && /^[ \t]*status[ \t]*=/ { next }
        { print }
      ' "$toml" > "$toml.stripped"
      mv "$toml.stripped" "$toml"
      echo "check_toml_image: stripped [metadata] status from $CASE_LABEL task.toml (written back)"
    fi
    echo "check_toml_image: ok $CASE_LABEL -- $val"

# (fix_toml_image / fix_quality_audit command definitions removed 2026-08-27:
# the week2 pipeline no longer wires autofix steps -- a failing check drops
# the case for a human fix instead of attempting an in-pipeline repair.
# The adapter scripts stay in adapters/ for manual use.)

# Per-case pre-check 2: cyber-gate acc-quality-audit (11-point verifier-trust-boundary).
# Invokes the acc-quality-audit skill via `claude -p` (subagent reads case files
# statically and checks S1-S11: candidate code isolation, privilege drop,
# self-report, mutable oracle, fd forgery, PoC compile bypass, etc.).
# DO NOT PROMOTE (critical/high/direct_removal FAIL) blocks admission.
# PROMOTE-WITH-WARNINGS (medium only) passes but is recorded.
# Report is saved to $RUN_DIR/quality/<case-label>.txt.
#
# CYBER_GATE_ROOT  path to the cyber-gate source tree (default: /home/foo/project/cyber-gate).
check_quality:
  uses: adapters/acc-quality-audit.sh
  # Which endpoint the audit subagent talks to is a submission setting, not
  # ambient state: without llm_spec the adapter falls through to whatever
  # ANTHROPIC_* the environment happens to carry (the interactive claude
  # gateway), whose 500s/truncations were being archived as audit reports.
  # Same spec name/shape as tc-batch1's quality-audit-llm.
  llm_spec: quality-audit-llm
  env: [PATH, HOME, CYBER_GATE_ROOT]

# (fix_quality_audit definition removed 2026-08-27 alongside fix_toml_image;
# see note above.)

# Admission oracle/nop trials use the real Harbor adapter.
# Post-admission trajectory layout check.
# Verifies every trial-level result.json under jobs/ has agent/trajectory.json.
# Missing trajectory = incomplete/timed-out run; materialize would publish empty
# trajectory tree. Non-blocking WARNs for absent verifier/reward.{txt,json}.
check_traj_layout:
  uses: adapters/check-traj-layout.sh
  env: [PATH, HOME]

harbor:
  uses: adapters/harbor.sh
  env: [DOCKER_HOST, PATH, HOME]

# Mock adapter: skips the LLM, replays jobs/ trails, writes reward=0.0.
forge_flow_fuzz_mock:
  uses: adapters/forge-flow-fuzz-mock.sh
  env: [PATH, HOME, DOCKER_HOST, ROLLOUT_MAN_HARBOR_ADAPTER]

materialize_week2:
  uses: adapters/materialize-forge-week2.sh
  env: [PATH, HOME]

# Per-trial materializer: builds this trial's slice of the two HF trees
# inside its own OUT_DIR/materialized/{cases,trajectories}.
materialize_week2_trial:
  uses: adapters/materialize-forge-week2-trial.sh
  env: [PATH, HOME]

record_progress:
  uses: adapters/record-forge-progress.sh
  # PROGRESS_FILE unset: the adapter falls back to ./Progress.md in rollout-man's
  # working directory (the repo root), so the ledger still lands somewhere sane.
  env: [PATH, HOME, PROGRESS_FILE]

ship_week2_atomic:
  uses: adapters/ship-hf-week2-atomic.sh
  env: [HF_TOKEN, HF_HOME, HF_REVISION, HF_PRIVATE, HOME, PATH]

ship_week2_cases:
  uses: adapters/ship-hf-week2-cases.sh
  env: [HF_TOKEN, HF_HOME, HF_REVISION, HF_PRIVATE, HOME, PATH,
        ROLLOUT_MAN_SHIP_HF_ADAPTER]

ship_week2_trajectories:
  uses: adapters/ship-hf-week2-trajectories.sh
  env: [HF_TOKEN, HF_HOME, HF_REVISION, HF_PRIVATE, HOME, PATH,
        ROLLOUT_MAN_SHIP_HF_ADAPTER]
---
# The audit/fix subagents' endpoint (check_quality, fix_quality_audit).
# Same spec tc-batch1 declares: the local tingly gateway fronting kimi-k3.
kind: LLMSpec
name: quality-audit-llm
provider: anthropic
base_url: http://localhost:12584/tingly/anthropic
model: kimi-k3
api_key_env: ANTHROPIC_AUTH_TOKEN
---
kind: Experiment
name: tc-batch2-regate7

case_defaults:
  source: local

# TEMPORARY (2026-08-28): parallel re-gate of the 7 cases watch21 had not
# cleanly processed when it was killed -- two false-rejected by infrastructure
# failures (2620992: audit hit the 64k output-token cap; 577512f: audit killed
# with the watch), four never reached in the serial queue, one re-gate after
# the R1/S4 fixes (bc0daf9/d8a352b). Ship steps are REMOVED: admitted cases
# are materialized locally only, and are pushed to HF by hand after the user
# signs off. Delete this file once the batch lands.
cases:
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch2/nghttp2-2620992-commit-fc17c0a-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch2/nghttp2-577512f-commit-dd038bf-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch2/nghttp2-5de2c7a-commit-92a56d0-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch2/spidermonkey-56bf35a-bug-1985765-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch2/tarantool-bc0daf9-commit-dd0ac81-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch2/tarantool-d8a352b-commit-51d0a9b-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch2/unbound-5eb362a-commit-a05d460-t4

matrix:
  agents:
    - name: forge-flow-fuzz
  trials: 1

# 24 cases × 1 trial each. Admission (oracle+nop) runs two harbor trials per
# case; only admission is parallelised heavily. Mock trials are near-instant.
concurrency: 8
max_attempts: 1

pipeline:
  per_case_concurrency: 7
  per_case:
    # 0. reject an oversized case (packaging mistake) before any container work.
    - uses: check_case_size
      on_failure: skip
    # 1. task.toml must have docker_image -- catches packaging defects early.
    #    (Autofix removed 2026-08-27: fix_toml_image's build+push+backfill is
    #    better run by hand than by a loop that also re-gates on adapter churn.)
    - uses: check_toml_image
      on_failure: skip
    # 2. acc-quality-audit (11-point verifier-trust-boundary AI review via claude -p).
    #    Autofix removed 2026-08-27: fix_quality_audit's repair quality was poor
    #    (half-applied patches, empty-report "fixes", category ping-pong). A
    #    failing audit now drops the case for a human fix instead of attempting
    #    an in-pipeline repair.
    - uses: check_quality
      on_failure: skip
    # 3. admission -- oracle must score 1.0, nop must score 0.0.
    #    on_failure: skip so one case's rejection (or a harbor ENV_FAILED --
    #    e.g. a packaging defect check_toml_image didn't catch) drops just
    #    that case instead of cancel()-ing the whole per_case run (see
    #    internal/run/run.go perCase: a step that returns a plain error, not
    #    ErrSkipCase, aborts every case still queued behind the semaphore).
    - uses: admission
      on_failure: skip
      with: {oracle_min_reward: 1.0, nop_max_reward: 0.0, trials: 1}
    # 4. trajectory layout -- jobs/ must have agent/trajectory.json per trial.
    #    on_failure: skip drops the case rather than aborting the whole run.
    - uses: check_traj_layout
      on_failure: skip

  per_trial:
    - uses: forge_flow_fuzz_mock

    # Mock always writes 0.0 but guard stays for structural consistency.
    - uses: guard
      name: terminal-acc-only
      with: {max_reward_exclusive: 0.6, require_measured: true}
      on_violation: drop

    - uses: redact
      with: {keys: required, ips: {traj: true, logs: true}}

    # This trial's slice of the two trees, inside its own OUT_DIR. Rejected
    # trials never wrote OUT_DIR/case, so the step exits 0 and there is
    # nothing to ship.
    - uses: materialize_week2_trial

    # NO ship step in this file (2026-08-28): HF pushes go through the user.
    # Admitted cases' materialized/ trees sit in their trial OUT_DIRs, ready
    # for a manual ship_week2_atomic once approved.

  per_experiment: []

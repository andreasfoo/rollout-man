# One local case, two agents, and the trails go back into this repo.
#
#   submit    a case from the working tree -- no registry, no id, just a path
#   gate      oracle must reach 1.0 and nop must stay at 0.0, or the case is
#             unmeasurable and nothing is reported for it
#   execute   Harbor runs every trial; how a trial runs is its business
#   scrub     keys always, IPs in anything that leaves the machine
#   ship      after the whole batch, commit the trails to test/cases/jobs
#
# Run it:
#   export ANTHROPIC_API_KEY=...          # only the claude-code agent needs it
#   rollout-man run experiments/libaom-trails.yaml
#
# On a shared runner the operator keeps the commands out of the submission:
#   rollout-man run experiments/libaom-trails.yaml --commands commands.example.yaml
# and this file's own kind: Commands document is then refused, not merged.

---
kind: Commands
timeout: 120m
max_attempts: 1

# Executing a trial is Harbor's job (harbor run), reached as a command.
# uses: + sha256: pins the adapter -- if the file changes, the run is refused.
harbor:
  uses: adapters/harbor.sh
  sha256: d822f0cf2ea49988a32766b479ee679d5869272b38e2b466fe7c756a81bfb04f

# Uploading is a command too, and it is what "batch upload" means here: it runs
# once, after every trial in the batch has finished.
ship:
  uses: adapters/ship-github.sh
  sha256: 61b73aac154b7246d2cb12be1baafee0b4c759ac362f274816f6e657b9e0e749

---
kind: LLMSpec
name: sonnet
provider: anthropic
model: anthropic/claude-sonnet-4-5
api_key_env: ANTHROPIC_API_KEY

---
kind: Experiment
name: libaom-trails

case_defaults:
  source: local

# A case is a place, not an id.
cases:
  - path: test/cases/libaom-cc9e46cb-bug-6491968-t4

matrix:
  agents:
    - name: oracle                    # the ground truth: its trail is the reference
    - name: claude-code               # a Harbor agent id, passed straight through
      llm_spec: sonnet
  trials: 1

concurrency: 2
max_attempts: 1

# The key names the unit the step runs on: once per case, once per trial, once
# per experiment. That is also the answer to "when does the upload happen" --
# it is under per_experiment, so it happens once, at the end of the batch.
pipeline:
  per_case:
    admission:
      require: admitted
      oracle_min_reward: 1.0
      nop_max_reward: 0.0
      trials: 1

  per_trial:
    redact:
      keys: required                  # a key in a published trajectory cannot be taken back
      ips: {traj: true, logs: false}

  per_experiment:
    ship:
      using: ship
      dest: "test/cases/jobs/{{.Experiment}}/{{.RunID}}"

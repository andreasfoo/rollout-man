# kimi-k3 trajectory top-up for nfsganesha-412b5c4 (2026-09-04).
#
# Clone of tc-batch3-kimi3-topup4-memcached.yaml with the case path and names
# swapped. nfsganesha-412b5c4 was rejected 09:28 at check_toml_image (empty
# docker_image), backfilled + pinned, then rejected 10:16 at admission
# (oracle 0): harbor's OracleAgent runs solve.sh as the agent user, and the
# image had /solution root-owned 700, so "bash /solution/solve.sh" died with
# Permission denied (exit 126) and /app/exploit.py was never placed. Repaired
# the same day: /solution root-owned 755 (kamailio convention) + the
# auditor's S8 fix (verifier wipes /tmp/solution and /tmp/verifier_output
# instead of consuming pre-seeded content). The fix is baked, so the image
# was rebuilt as :r1 and task.toml re-pinned (865c9825af05...). The honest
# re-gate started 10:23:33 on hash 3ab571c96243: quality PROMOTE, oracle
# PASS 1.00 (11:15:24), nop PASS 0, admitted 11:21:52, first trajectory
# shipped 11:40:28 (reward 0.100).
#
#   nfsganesha-412b5c4   1 traj on HF -> +3   (target 4)
#
# PRECONDITION: watch's ship_week2_atomic must have landed the task tree +
# first trajectory on origin/week3 (ship_week2_trajectories requires an
# existing task tree). Do not launch before verifying via hfcase git ls-tree.
#
# Everything else -- agent wiring, gates, ship destination -- is inherited
# verbatim from tc-batch3-kimi3-topup4-kamailio.yaml; see that file's header
# and tc-batch3-kimi3-topup4.yaml for the ccbin/stdin-prompt/
# --allow-agent-host rationale. Concurrency 2 (one case x 3 trials) since
# watch is live and its trials take priority.
#
# Preconditions (env):
#   HF_TOKEN=...   (ship)
#   PROGRESS_FILE  optional (record_progress)
# Run:
#   ./rollout-man run experiments/tc-batch3-kimi3-topup4-nfsganesha.yaml --commands experiments/commands.yaml
---
kind: LLMSpec
name: buglocation-llm
provider: anthropic
# kimi-k3 per user direction (2026-08-31) -- same model as the rollouts.
# Declared for schema completeness; no per_case buglocation step below
# (admission already wrote solution/bug_location.json for every case).
base_url: http://localhost:12584/tingly/anthropic
model: kimi-k3
api_key_env: ANTHROPIC_AUTH_TOKEN
---
kind: Experiment
name: tc-batch3-kimi3-topup4-nfsganesha

case_defaults:
  source: local

# nfsganesha only -- see the header for the atomic-ship precondition.
cases:
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch3/nfsganesha-412b5c4-commit-874a7bf-t4

matrix:
  agents:
    - name: forge-flow-fuzz
  trials: 3

# 1 case x 3 trials = 3 harbor runs (up to 3600s agent timeout each +
# verifier + docker overhead). max_attempts 2 absorbs proxy-hiccup
# HOST_ERRORs at the command layer (batch2/batch3 x3 precedent).
concurrency: 2
max_attempts: 2

pipeline:
  # Campaign-wide destination settings, declared once: every step's command
  # inherits these as env vars. week3 is the HF branch batch3 publishes to;
  # trajectory/ lives at the repo root next to task/.
  with:
    hf_revision: week3
    hf_task_path: task/week3

  # No per_case steps: admitted case (watch, 2026-09-03 16:0x) with
  # solution/bug_location.json already written by watch's buglocate_kimi.
  # Re-running admission gates would only re-burn audit budget against
  # unchanged bytes.
  per_case_concurrency: 1

  per_trial:
    - uses: rollout
      with: {using: kimi3_rollout}

    # No reward filter (2026-08-31 policy): every completed rollout ships.
    - uses: redact
      with: {keys: required, ips: {traj: true, logs: true}}

    # Trajectory-only materialization + sanitization + leak gate.
    - uses: materialize_week2_trial

    # CJK gate over exactly what this trial would ship; skip = this trial
    # cannot ship, the trajectory stays in OUT_DIR for manual triage.
    - uses: check_no_chinese_traj
      with: {traj_dir: "{{steps.materialize_week2_trial.outputs.trajectories_dir}}"}
      on_failure: skip

    # API-failure backstop over the same tree (poisoned/truncated
    # transcripts from proxy 429 fights must not reach the dataset).
    - uses: check_no_api_error_traj
      with: {traj_dir: "{{steps.materialize_week2_trial.outputs.trajectories_dir}}"}
      on_failure: skip

    - uses: ship
      with:
        using: ship_week2_trajectories
        path: "{{steps.materialize_week2_trial.outputs.trajectories_dir}}"
        dest: tinglydev/cyber-xianjin
        # hf_revision/hf_task_path come from pipeline.with above.

  per_experiment:
    - uses: record_progress

# kimi-k3 trajectory top-up for the 9 batch3 cases SHORT of 4 trajectories
# on HF week3 (2026-09-06).
#
# Closes the final gap: every batch3 case on week3 reaches >=4 kimi
# trajectories. The other 25 batch3 cases already have >=4 (18 via
# tc-batch3-kimi3-x3.yaml, the rest via earlier top-ups / watch atomic
# ships). These nine lagged because they were synced to week3 (#124) but
# never went through the x3 top-up (not in the 18-case active watch yaml).
#
# Per-case starting point and what this campaign adds (trials: 3 each):
#
#   dovecot-d344c33-...-bin-t4               1 traj -> +3 -> 4
#   harfbuzz-5ce0b127-raster-gradientlut-t4 2 traj -> +3 -> 5
#   harfbuzz-a3fa7d3-mort-ctxoob-t4          1 traj -> +3 -> 4
#   harfbuzz-ae860db-gpos-ligarray-oob-t4    2 traj -> +3 -> 5
#   kamailio-62e2c61-commit-d7a7f22-t4       1 traj (watch atomic ship) -> +3 -> 4
#   mariadb-e2088ce-commit-9749d71-t4         1 traj -> +3 -> 4
#   spidermonkey-commit-7f081dc-t4            2 traj -> +3 -> 5  (R3 too-easy;
#       included per owner 2026-09-06 "all short get reroll")
#   squid-06a5d8-t4                           1 traj -> +3 -> 4
#   squid-8617e9-t4                           1 traj -> +3 -> 4
#
# HARD PRECONDITION satisfied: each case already has its task tree on HF
# week3 (task/week3/<case>/ exists for all 34 batch3 cases). ship_week2_trajectories
# writes ONLY under trajectory/<case>/ and assumes the task tree is present.
#
# Agent wiring: adapters/kimi3-rollout.sh runs `harbor run -c
# agent-ccbin-kimi3.yaml` -- ClaudeCodeBinThirdParty (native claude binary
# uploaded to /usr/bin/claude, zero egress for agent setup, only the LLM
# proxy allowlisted). The adapter passes CLAUDE_CODE_PROMPT_VIA_STDIN=1 and
# --allow-agent-host for the proxy CIDR (injected at runtime).
#
# Ship: trajectories ONLY, per trial, via materialize_week2_trial +
# ship_week2_trajectories to hf_revision week3. Every completed rollout
# ships regardless of reward (2026-08-31 policy).
#
# Preconditions (env, sourced from the live watch PID at launch):
#   HF_TOKEN=...   (ship)
#   ANTHROPIC_*    (kimi proxy)
# Run:
#   ./rollout-man run experiments/tc-batch3-kimi3-topup9.yaml --commands experiments/commands.yaml
---
kind: LLMSpec
name: buglocation-llm
provider: anthropic
# kimi-k3 per user direction (2026-08-31) -- same model as the rollouts.
# Declared for schema completeness; no per_case buglocation step below
# (admission already wrote solution/bug_location.json for every case).
base_url: http://localhost:12584/tingly/anthropic
model: kimi-k3
api_key_env: ANTHROPIC_AUTH_TOKEN
---
kind: Experiment
name: tc-batch3-kimi3-topup9

case_defaults:
  source: local

# The nine batch3 cases short of 4 trajectories on week3 as of 2026-09-06.
# All nine already have their task tree on HF week3 (ship_week2_trajectories
# prerequisite). spidermonkey-commit-7f081dc-t4 included per owner directive.
cases:
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch3/dovecot-d344c33-commit-b012cfb3-bin-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch3/harfbuzz-5ce0b127-raster-gradientlut-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch3/harfbuzz-a3fa7d3-mort-ctxoob-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch3/harfbuzz-ae860db-gpos-ligarray-oob-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch3/kamailio-62e2c61-commit-d7a7f22-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch3/mariadb-e2088ce-commit-9749d71-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch3/spidermonkey-commit-7f081dc-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch3/squid-06a5d8-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch3/squid-8617e9-t4

matrix:
  agents:
    - name: forge-flow-fuzz
  trials: 3

# 9 cases x 3 trials = 27 harbor runs (up to 3600s agent timeout each +
# verifier + docker overhead). Concurrency 6 (matches x3); the watch is
# parked/idle so contention is low. max_attempts 2 absorbs proxy-hiccup
# HOST_ERRORs at the command layer (batch2/batch3 x3 precedent).
concurrency: 6
max_attempts: 2

pipeline:
  # Campaign-wide destination settings, declared once: every step's command
  # inherits these as env vars. week3 is the HF branch batch3 publishes to;
  # trajectory/ lives at the repo root next to task/ (task/week3 already
  # holds the cases from watch's atomic ships).
  with:
    hf_revision: week3
    hf_task_path: task/week3

  # No per_case steps: these are admitted cases with
  # solution/bug_location.json already written by watch's buglocate_kimi.
  # Re-running admission gates would only re-burn audit budget against
  # unchanged bytes.
  per_case_concurrency: 4

  per_trial:
    - uses: rollout
      with: {using: kimi3_rollout}

    # No reward filter (2026-08-31 policy): every completed rollout ships.
    - uses: redact
      with: {keys: required, ips: {traj: true, logs: true}}

    # Trajectory-only materialization + sanitization + leak gate.
    - uses: materialize_week2_trial

    # CJK gate over exactly what this trial would ship; skip = this trial
    # cannot ship, the trajectory stays in OUT_DIR for manual triage.
    - uses: check_no_chinese_traj
      with: {traj_dir: "{{steps.materialize_week2_trial.outputs.trajectories_dir}}"}
      on_failure: skip

    # API-failure backstop over the same tree (poisoned/truncated
    # transcripts from proxy 429 fights must not reach the dataset).
    - uses: check_no_api_error_traj
      with: {traj_dir: "{{steps.materialize_week2_trial.outputs.trajectories_dir}}"}
      on_failure: skip

    - uses: ship
      with:
        using: ship_week2_trajectories
        path: "{{steps.materialize_week2_trial.outputs.trajectories_dir}}"
        dest: tinglydev/cyber-xianjin
        # hf_revision/hf_task_path come from pipeline.with above.

  per_experiment:
    - uses: record_progress

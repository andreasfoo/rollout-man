# The runner's commands: what a step *is*. Kept apart from the submissions,
# which only choose which steps run.
#
#   rollout-man run experiments/local.yaml --commands experiments/commands.yaml
#
# Every adapter runs via uses:, its file executed directly under its own #!
# line. The manifest written per run records each command's content hash for
# provenance, but a changed file is no longer refused -- edit the adapter and
# it just runs the new version.
---
kind: Commands
timeout: 120m
max_attempts: 3

# Each command sees only the variables it declares. A shipper that talks to git
# has no business holding the model provider's key.
inherit_env: false

# ── execute ────────────────────────────────────────────────────────────────
# Running a trial is Harbor's job. This is the only way in.
harbor:
  uses: adapters/harbor.sh
  env: [DOCKER_HOST, ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY, PATH, HOME]

# ── where cases come from ──────────────────────────────────────────────────
source_git:
  script: |
    set -euo pipefail
    git clone --quiet --depth 1 --branch "${GIT_REF:-main}" "${GIT_REPO}" "${LOCAL_PATH}"
  env: [SSH_AUTH_SOCK, HOME, PATH]

source_hf:
  uses: adapters/source-hf.sh
  env: [HF_TOKEN, HF_HOME, HOME, PATH]

# A step that just says where the pipeline has reached. Useful as the first
# per_case step: the log then shows which case was rejected, and which never
# got far enough to be.
announce_case:
  script: 'echo "=== case ${CASE_LABEL} (${CASE_SHA})"'

# ── where results go ───────────────────────────────────────────────────────
# Live kimi-k3 rollout: harbor run with the agent-under-test config pinned by
# the command's env (agent-kimi3.yaml + PYTHONPATH so harbor imports the
# maintained agent module, not the stale site-packages copy). Used via the
# builtin rollout action: `- uses: rollout / with: {using: kimi3_rollout}`.
kimi3_rollout:
  uses: adapters/kimi3-rollout.sh
  env: [PATH, HOME, DOCKER_HOST, ROLLOUT_MAN_HARBOR_ADAPTER,
        KIMI3_HARBOR_CONFIG, KIMI3_HARBOR_CWD]

# Bug localization for accepted cases: writes RUN_DIR/buglocation/<case>.json
# (corpus-standard solution/bug_location.json shape). Needs an llm_spec'd
# endpoint; uses the case's own admission trajectory as evidence.
buglocate_kimi:
  uses: adapters/buglocation.sh
  llm_spec: buglocation-llm
  # Two 20m subagent attempts + preflight, same envelope as acc_quality_audit.
  timeout: 45m
  env: [PATH, HOME, LLM_BASE_URL, LLM_MODEL, LLM_API_KEY]


ship_local:
  uses: adapters/ship-local.sh
  env: [SHIP_ROOT, HOME, PATH]

ship_github:
  uses: adapters/ship-github.sh
  env: [SHIP_REPO, SHIP_BRANCH, SSH_AUTH_SOCK, HOME, PATH,
        GIT_AUTHOR_NAME, GIT_AUTHOR_EMAIL, GIT_COMMITTER_NAME, GIT_COMMITTER_EMAIL]

ship_hf:
  uses: adapters/ship-hf.sh
  env: [HF_TOKEN, HF_HOME, HF_REVISION, HF_PRIVATE, HF_PATH_IN_REPO, HOME, PATH]

ship_onedrive:
  uses: adapters/ship-onedrive.sh
  env: [RCLONE_REMOTE, RCLONE_CONFIG, ONEDRIVE_REMOTE]

# OneDrive, S3, WebDAV, sftp -- whatever the operator's rclone.conf reaches.
ship_rclone:
  uses: adapters/ship-rclone.sh
  env: [RCLONE_REMOTE, RCLONE_CONFIG, HOME, PATH]

# ── shared by the tc_batch / forge-flow experiments ─────────────────────────
# Moved here from the five submissions that each restated them. An
# experiment overrides one of these by redefining it; the rest still come
# from here.

# Hard gate: no CJK text in any file this trial is about to ship. Two-tier
# (2026-08-31): a cheap codepoint scan first, then fasttext lid.176
# language-ID adjudication on any CJK-bearing line -- a raw disassembly
# dump whose bytes decode to CJK glyphs (clickhouse-e9a9df4) passes, real
# Chinese sentences still block. kimi-k3 sometimes answers in Chinese, and
# that must not land on the dataset. TRAJ_DIR comes from the step's with:.
check_no_chinese_traj:
  uses: adapters/check-no-chinese-traj.sh
  env: [PATH, HOME]

# Hard gate: no API-failure shapes in the trajectory's stream-json
# transcripts (2026-08-31). A trial whose claude CLI retried through
# 429s/overloads/connection drops can still "succeed" -- harbor's result.json
# only surfaces TERMINAL API errors -- and then a poisoned or truncated
# transcript would ship. This parses the transcripts event by event and fails
# on isApiErrorMessage, system/api_error, non-success result, assistant text
# naming an API failure, or a claude-code.txt with no result event at all
# (truncated: the CLI died mid-run). kimi3-rollout.sh also calls it at the
# executor level, where the failure is HOST_ERROR and the trial RE-RUNS under
# max_attempts; as a per_trial step it is the ship-side backstop. TRAJ_DIR
# comes from the step's with:.
check_no_api_error_traj:
  uses: adapters/check-no-api-error-traj.sh
  env: [PATH, HOME]

check_toml_image:
  env: [PATH, HOME]
  script: |
    set -euo pipefail
    toml="$CASE_DIR/task.toml"
    [ -f "$toml" ] || { echo "check_toml_image: FAIL -- task.toml not found" >&2; exit 1; }
    if ! grep -qE '^\s*docker_image\s*=' "$toml"; then
      echo "check_toml_image: FAIL $CASE_LABEL -- no docker_image field" >&2; exit 1
    fi
    val=$(grep -E '^\s*docker_image\s*=' "$toml" | head -1 | sed 's/.*=\s*//' | tr -d '"'"'"' ')
    [ -n "$val" ] || { echo "check_toml_image: FAIL $CASE_LABEL -- docker_image is empty" >&2; exit 1; }
    # Pullability, not just presence (2026-09-01: tarantool-2dbe1dc passed the
    # field check with an image tag that existed nowhere -- every trial then
    # died in 9s on "manifest unknown"). Local store OR registry must resolve
    # it. Digest-pinned refs skip the registry probe: the pin IS the proof.
    case "$val" in
      *@sha256:*) : ;;
      *)
        if ! docker image inspect "$val" >/dev/null 2>&1 && \
           ! docker manifest inspect "$val" >/dev/null 2>&1; then
          echo "check_toml_image: FAIL $CASE_LABEL -- image $val neither in local store nor on registry" >&2
          exit 1
        fi
        ;;
    esac
    if [ ! -d "$CASE_DIR/environment" ]; then
      echo "check_toml_image: FAIL $CASE_LABEL -- no environment/ directory (harbor run --path" \
        "requires task.toml + environment/ to treat this dir as a single task, otherwise it" \
        "falls through to dataset-mode and admission fails with 'Either datasets or tasks" \
        "must be provided')" >&2
      exit 1
    fi
    echo "check_toml_image: ok $CASE_LABEL -- $val"

check_traj_layout:
  uses: adapters/check-traj-layout.sh
  env: [PATH, HOME]

forge_flow_fuzz_mock:
  uses: adapters/forge-flow-fuzz-mock.sh
  env: [PATH, HOME, DOCKER_HOST, ROLLOUT_MAN_HARBOR_ADAPTER]

materialize_week2:
  uses: adapters/materialize-forge-week2.sh
  env: [PATH, HOME]

# Per-trial variant: materializes one trial's slice of the two trees inside
# its own OUT_DIR, for per_trial ship steps that publish incrementally.
materialize_week2_trial:
  uses: adapters/materialize-forge-week2-trial.sh
  env: [PATH, HOME]

record_progress:
  uses: adapters/record-forge-progress.sh
  env: [PATH, HOME, PROGRESS_FILE]

ship_week2_cases:
  uses: adapters/ship-hf-week2-cases.sh
  env: [HF_TOKEN, HF_HOME, HF_REVISION, HF_PRIVATE, HOME, PATH,
        ROLLOUT_MAN_SHIP_HF_ADAPTER]

ship_week2_trajectories:
  uses: adapters/ship-hf-week2-trajectories.sh
  env: [HF_TOKEN, HF_HOME, HF_REVISION, HF_PRIVATE, HOME, PATH,
        ROLLOUT_MAN_SHIP_HF_ADAPTER]

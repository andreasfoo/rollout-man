# kimi-k3 trajectory rollout for gstreamer-130bd3-commit-4e56994-t4
# (2026-09-07). Single-case campaign: 4 trajectories, then the case is
# complete on week3 (task tree ships via watch's ship_week2_atomic).
#
# This case was the last blocked one: its authored Dockerfile builds two
# in-image GStreamer ASan monorepo prefixes, so it shipped with no
# docker_image pin. Per the 2026-09-07 "ship binaries, build on host"
# directive, both prefixes were built in a disposable ubuntu:20.04
# builder on the 128-core host (clang 10 / meson 1.11.2 / -O1
# -gdwarf-4 / ASan, core + base + good-rtp, build.sh from the case),
# oracle-smoke-tested in the builder (ROLE=oracle 1.00,
# ROLE=nop 0.00), and baked into a slim runtime image
# cyborgzero/gstreamer-130bd3-commit-4e56994-t4:r1 pinned by
# RepoDigest in task.toml. Watch re-gated and admitted the case
# (oracle 1.00 / nop 0.00 on the shipped image).
#
# Agent wiring: adapters/kimi3-rollout.sh runs `harbor run -c
# agent-ccbin-kimi3.yaml` -- ClaudeCodeBinThirdParty (native claude
# binary uploaded to /usr/bin/claude, zero egress for agent setup,
# only the LLM proxy allowlisted). CLAUDE_CODE_PROMPT_VIA_STDIN=1
# keeps the prompt out of argv so an agent's `pkill -f` cannot kill
# the CLI; --allow-agent-host for the proxy CIDR is injected at
# runtime and never written into a published task.toml.
#
# Ship: trajectories ONLY, per trial, via materialize_week2_trial +
# ship_week2_trajectories to hf_revision week3. New-path-only HF
# writes (timestamps + harbor random suffixes make collisions
# impossible); every completed rollout ships regardless of reward
# (2026-08-31 policy).
#
# Preconditions (env):
#   HF_TOKEN=...   (ship)
# Run:
#   ./rollout-man run experiments/tc-batch3-kimi3-gst130bd3.yaml --commands experiments/commands.yaml
---
kind: LLMSpec
name: buglocation-llm
provider: anthropic
# kimi-k3 per user direction (2026-08-31) -- same model as the rollouts.
# Declared for schema completeness; no per_case buglocation step below
# (admission already wrote solution/bug_location.json for every case).
base_url: http://localhost:12584/tingly/anthropic
model: kimi-k3
api_key_env: ANTHROPIC_AUTH_TOKEN
---
kind: Experiment
name: tc-batch3-kimi3-gst130bd3

case_defaults:
  source: local

cases:
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch3/gstreamer-130bd3-commit-4e56994-t4

matrix:
  agents:
    - name: forge-flow-fuzz
  # 3, not 4: watch's post-admission pipeline ships 1 live rollout
  # (task tree + first trajectory via ship_week2_atomic); this topup
  # brings the case to 4 total.
  trials: 3

# 1 case x 3 trials = 3 harbor runs (up to 3600s agent timeout each +
# verifier + docker overhead). Concurrency 3 so all three run at once:
# watch is live but has no other cases in flight (this is the last
# unadmitted one), and the runtime image needs no building (binaries
# prebuilt). max_attempts 2 absorbs proxy-hiccup HOST_ERRORs at the
# command layer (batch2/batch3 x3 precedent).
concurrency: 1
# max_attempts 3, single-flight (2026-09-08: 0/21 across six rolls.
# Root cause: the CLI sends thinking {type: adaptive} (no budget); on this
# case kimi-k3 loops long thinking until one response fills the whole
# requested max_tokens, and the CLI treats cap-filling responses as a
# fatal API error -> AGENT_FAILED. Lowering
# CLAUDE_CODE_MAX_OUTPUT_TOKENS (roll 6, 32k) does NOT help: the cap
# size is irrelevant, only the response shape matters. MAX_THINKING_TOKENS
# env is ignored on the SDK --print path. Fix (roll 7): a rewriting
# forwarder /tmp/thinklimit-shim.py on 143.89.191.124:12590 converts
# adaptive -> {enabled, budget_tokens 8192}, which the fireworks backend
# enforces server-side (tingly passes thinking through verbatim,
# verified 2026-09-08). Run via
# KIMI3_HARBOR_CONFIG=agent-ccbin-kimi3-shim.yaml.)
max_attempts: 3

pipeline:
  with:
    hf_revision: week3
    hf_task_path: task/week3

  # No per_case steps: admitted case, bug_location already written by
  # watch's buglocate_kimi during admission. Re-running gates would
  # only re-burn audit budget against unchanged bytes.
  per_case_concurrency: 4

  per_trial:
    - uses: rollout
      with: {using: kimi3_rollout}

    # No reward filter (2026-08-31 policy): every completed rollout ships.
    - uses: redact
      with: {keys: required, ips: {traj: true, logs: true}}

    - uses: materialize_week2_trial

    - uses: check_no_chinese_traj
      with: {traj_dir: "{{steps.materialize_week2_trial.outputs.trajectories_dir}}"}
      on_failure: skip

    - uses: check_no_api_error_traj
      with: {traj_dir: "{{steps.materialize_week2_trial.outputs.trajectories_dir}}"}
      on_failure: skip

    - uses: ship
      with:
        using: ship_week2_trajectories
        path: "{{steps.materialize_week2_trial.outputs.trajectories_dir}}"
        dest: tinglydev/cyber-xianjin
        # hf_revision/hf_task_path come from pipeline.with above.

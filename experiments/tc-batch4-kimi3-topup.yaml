  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch4/spidermonkey-d63b07e-bug-1904011-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch4/spidermonkey-de91275-bug-2010940-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch4/tarantool-64ba291f-commit-4205553a-bin-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch4/yara-d5ae8ef-commit-7b7c796-bin-t4

matrix:
  agents:
    - name: forge-flow-fuzz
  trials: 3

# 28 cases x 3 trials = 84 harbor runs (freetype lands at 5; the matrix has
# no per-case count -- week3 topup5-short precedent). Up to 3600s agent
# timeout each + verifier + docker overhead. concurrency 3: the batch4 watch
# is live and its trials take priority; spidermonkey builds are heavy.
# max_attempts 2 absorbs proxy-hiccup HOST_ERRORs at the command layer
# (x3/topup10 precedent).
concurrency: 3
max_attempts: 2

pipeline:
  with:
    hf_revision: week4
    hf_task_path: task/week4

  # No per_case steps: admitted cases with solution/bug_location.json
  # already written. Re-running admission gates would re-burn audit budget
  # against unchanged bytes.
  per_case_concurrency: 3

  per_trial:
    - uses: rollout
      with: {using: kimi3_rollout}

    # No reward filter (2026-08-31 policy): every completed rollout ships.
    - uses: redact
      with: {keys: required, ips: {traj: true, logs: true}}

    # Trajectory-only materialization + sanitization + leak gate.
    - uses: materialize_week2_trial

    # CJK gate over exactly what this trial would ship; skip = this trial
    # cannot ship, the trajectory stays in OUT_DIR for manual triage.
    - uses: check_no_chinese_traj
      with: {traj_dir: "{{steps.materialize_week2_trial.outputs.trajectories_dir}}"}
      on_failure: skip

    # API-failure backstop over the same tree.
    - uses: check_no_api_error_traj
      with: {traj_dir: "{{steps.materialize_week2_trial.outputs.trajectories_dir}}"}
      on_failure: skip

    - uses: ship
      with:
        using: ship_week2_trajectories
        path: "{{steps.materialize_week2_trial.outputs.trajectories_dir}}"
        dest: tinglydev/cyber-xianjin
        # hf_revision/hf_task_path come from pipeline.with above.

  per_experiment:
    - uses: record_progress

# Ship trajectories only (no task/week2 upload) for 13 pre-accepted tc_batch1
# cases that satisfy all three of the user's eligibility conditions:
#   1. task.toml [agent] timeout_sec == 3600.0
#   2. accepted (jobs/*/result.json reward < 0.6)
#   3. trajectory model_name == kimi-k3
#
# Explicitly scoped: this batch does NOT publish task/week2 (no
# ship_week2_cases / accepted-cases step) -- only trajectory/<case>/jobs/ via
# accepted-trajectories, per the user's instruction. No check_quality gate
# either: eligibility here is exactly the three conditions above, not an
# acc-quality-audit pass/fail.
#
# Preconditions:
#   export HF_TOKEN=...
#   export PROGRESS_FILE=<path to a markdown progress doc>   (optional, appended)
#
# Run:
#   go build -o rollout-man ./cmd/rollout-man
#   ./rollout-man run experiments/tc-batch1-kimi-lowreward-trajectories.yaml
---
kind: Commands
# Shared adapters come from the library; only what differs is below.
include: [commands.yaml]
timeout: 30m
max_attempts: 1
inherit_env: false

# Admission still runs the real oracle and nop via harbor.sh so the gate
# fires normally, exactly as in tc-batch2-smoke.

# Mock adapter: skips the LLM, replays jobs/ trials, writes reward=0.0.

# Trajectories only -- no ship_week2_cases / accepted-cases step in this
# experiment (deliberate: this batch does not publish task/week2).
---
kind: Experiment
name: tc-batch1-kimi-lowreward-trajectories

case_defaults:
  source: local

# Frozen eligibility snapshot (2026-08-25): the 13 tc_batch1 cases with
# task.toml [agent] timeout_sec == 3600.0, accepted (reward < 0.6), and a
# kimi-k3 trajectory. See conversation/agent report for the full 58/59-case
# table this was derived from -- every other candidate failed on timeout_sec
# (2400 instead of 3600) or model (glm-5.2 / kimi-k2.x / claude family).
cases:
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch1/clickhouse-233fce6-issue-64933-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch1/clickhouse-256c1a5-issue-105462-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch1/clickhouse-4926d287-issue-65052-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch1/clickhouse-ab88ac3-issue-104566-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch1/clickhouse-b298fbee-issue-45986-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch1/duckdb-3f0eb51-issue-526-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch1/duckdb-4012e11-issue-3364-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch1/duckdb-4e33955-issue-4681-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch1/duckdb-928e9127-issue-20928-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch1/duckdb-dfd8755-issue-24465-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch1/libaom-cc9e46cb-bug-6491968-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch1/varnish-d1e3ffa-commit-20319dd6-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch1/wireshark-cfee53e-commit-108217f-t4

matrix:
  agents:
    - name: forge-flow-fuzz
  trials: 1

concurrency: 8
max_attempts: 1

pipeline:
  per_case_concurrency: 4
  per_case:
    # No check_quality / check_toml_image gate for this batch -- eligibility
    # is exactly the user's three conditions (timeout_sec, reward, model),
    # already verified out-of-band. Admission still runs oracle/nop for
    # basic sanity.
    - uses: admission
      with: {oracle_min_reward: 1.0, nop_max_reward: 0.0, trials: 1}

  per_trial:
    - uses: forge_flow_fuzz_mock

    # Mock always writes 0.0 but guard stays for structural consistency.
    - uses: guard
      name: terminal-acc-only
      with: {max_reward_exclusive: 0.6, require_measured: true}
      on_violation: drop

    - uses: redact
      with: {keys: required, ips: {traj: true, logs: true}}

  per_experiment:
    # Produce accepted-cases/ + accepted-trajectories/ under RUN_DIR, but
    # only ship the trajectories tree below -- accepted-cases/ is generated
    # (materialize_week2 always writes both) and simply left unpublished.
    - uses: materialize_week2

    - uses: ship
      with:
        using: ship_week2_trajectories
        path: accepted-trajectories
        dest: tinglydev/cyber-xianjin

    - uses: record_progress

matrix:
  agents:
    - name: forge-flow-fuzz
  trials: 3

# 63 cases x 3 trials = 189 harbor runs, each up to agent timeout (3600s for
# 59 cases, 2400s for 4) + verifier + docker overhead. 6 concurrent keeps
# ~6 docker compose stacks live -- the host ran 4 factory slots plus audits
# comfortably, and has 128 cores / 500G. max_attempts 2 (Commands) retries
# HOST_ERROR-class failures (proxy hiccups) once at the command layer.
# 2026-09-02 wave 4 (15 re-rolls): raised 6 -> 12. Wave-3 observed ~10-15G
# per stack, so 12 stacks fit in the 400G headroom, and the relaxed
# API-error gate + max_attempts absorb the extra proxy 429 pressure. Not
# used for a full 189-trial campaign -- proxy throughput is the real cap
# there; fine for a 15-trial mop-up.
concurrency: 12
max_attempts: 2

pipeline:
  # Buglocation is one kimi-k3 subagent call per case; serial gating made the
  # 2026-08-31 resume spend ~2h redoing uncached localizations before a single
  # trial could start. The proxy already serves 6 concurrent rollouts.
  per_case_concurrency: 4
  # Per-case bug localization (2026-08-31): writes RUN_DIR/buglocation/<case>.json
  # in the corpus-standard solution/bug_location.json shape. Does NOT write into
  # the case dir -- watch content-hashes solution/ and would re-gate. on_failure:
  # skip: a localization failure skips this case's trials' ship steps, but the
  # rollout trajectories still record.
  per_case:
    - uses: buglocation
      with: {using: buglocate_kimi}
      on_failure: skip

  per_trial:
    - uses: rollout
      with: {using: kimi3_rollout}

    # 2026-08-31 policy change: NO reward filter. All 63 cases ship here are
    # already admitted, and the campaign's product is the kimi-k3 attempt
    # itself -- every completed rollout ships, whatever its reward. (The
    # admission-time accepted trajectory is already on HF; these 3 extras
    # per case are the new data.)
    - uses: redact
      with: {keys: required, ips: {traj: true, logs: true}}

    # Trajectory-only materialization + sanitization + leak gate. The task
    # tree is also rebuilt inside the trial OUT_DIR (harmless, unpublished).
    - uses: materialize_week2_trial

    # CJK gate over exactly what this trial would ship. skip = this trial's
    # ship step is skipped (a skipped trial cannot ship); the CJK-bearing
    # trajectory stays in OUT_DIR for manual triage.
    - uses: check_no_chinese_traj
      with: {traj_dir: "{{steps.materialize_week2_trial.outputs.trajectories_dir}}"}
      on_failure: skip

    # API-failure backstop over the same tree (2026-08-31): a trial that
    # fought through 429s/overloads "succeeds" with a poisoned or truncated
    # transcript -- skip its ship. The executor-level hook in
    # kimi3-rollout.sh already RE-RUNS such trials under max_attempts; this
    # gate catches anything that still slips through (e.g. attempts
    # exhausted) and keeps it off the dataset.
    - uses: check_no_api_error_traj
      with: {traj_dir: "{{steps.materialize_week2_trial.outputs.trajectories_dir}}"}
      on_failure: skip

    - uses: ship
      with:
        using: ship_week2_trajectories
        path: "{{steps.materialize_week2_trial.outputs.trajectories_dir}}"
        dest: tinglydev/cyber-xianjin

  per_experiment:
    - uses: record_progress

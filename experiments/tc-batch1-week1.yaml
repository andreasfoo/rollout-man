  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch1/wireshark-cfee53e-commit-108217f-t4

matrix:
  agents:
    - name: forge-flow-fuzz
  trials: 1

# 50 cases × 1 trial each. Admission (oracle+nop) runs two harbor trials per
# case; only admission is parallelised heavily. Mock trials are near-instant.
concurrency: 8
max_attempts: 1

pipeline:
  per_case_concurrency: 4
  per_case:
    # 1. task.toml must have docker_image -- catches packaging defects early.
    - uses: check_toml_image
      on_failure: skip
    # 2. acc-quality-audit (11-point verifier-trust-boundary AI review).
    #    Re-judges current state -- not the AUDIT-REPORT.md 2026-08-22
    #    snapshot -- so a case whose S1/S2 fix from that pass did not fully
    #    hold gets caught here rather than silently promoted.
    - uses: check_quality
      on_failure: skip
      fix: fix_quality_audit
      fix_writeback: true
    # 3. admission -- oracle must score 1.0, nop must score 0.0.
    #    on_failure: skip so one case's rejection drops just that case
    #    instead of aborting the whole per_case run.
    - uses: admission
      on_failure: skip
      with: {oracle_min_reward: 1.0, nop_max_reward: 0.0, trials: 1}
    # 4. trajectory layout -- jobs/ must have agent/trajectory.json per trial.
    - uses: check_traj_layout
      on_failure: skip

  per_trial:
    - uses: forge_flow_fuzz_mock

    # Mock always writes 0.0 but guard stays for structural consistency.
    - uses: guard
      name: terminal-acc-only
      with: {max_reward_exclusive: 0.6, require_measured: true}
      on_violation: drop

    - uses: redact
      with: {keys: required, ips: {traj: true, logs: true}}

  per_experiment:
    # Builds accepted-cases/ + accepted-trajectories/ from accepted rows.
    # Despite the "week2" name (historical -- the script just does the
    # generic accepted-rows-to-two-trees materialization), it is reused as-is
    # here; only accepted-cases/ gets shipped below.
    - uses: materialize_week2

    # Only task files (accepted-cases/) publish this round -- no trajectory
    # upload. path: scopes ship to that one subtree of the run directory.
    - uses: ship
      with:
        using: ship_hf_task_cases
        dest: "tinglydev/cyber-xianjin::task/week1"
        path: accepted-cases

    - uses: record_progress

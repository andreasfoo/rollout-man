# tc_batch1 smoke: three real Harbor cases, end to end.
#
#   pre   (per case, two steps)
#         1. echo which case the pipeline has reached
#         2. admission -- oracle must reach 1.0 (the gate), nop must stay 0.0
#   run   nop + oracle + mock through the harbor command below, one trial each
#   post  (per case)  echo which run of which case finished
#   ship  (once, after the batch) one zip per case to onedrive:testcase/,
#         jobs files inside, ips and keys scrubbed
#
# Commands come from experiments/commands.yaml via include:. They used to be
# inlined here -- a verbatim copy of adapters/harbor.sh, comments and all --
# which meant every fix to the adapter had to be made twice and the copies
# drifted. A submission should say what it runs, not restate how.
#
# Run it:
#   go build -o rollout-man ./cmd/rollout-man
#   ./rollout-man run experiments/tcbatch1-smoke.yaml
#
# The case paths point at the accepted-data checkout next to this repo; cases
# are content-hashed at resolve time, so the hash in the log is the version
# these numbers belong to.

---
kind: Commands
timeout: 150m          # one harbor trial: build + agent + verifier, cold
include: [commands.yaml]

---
kind: LLMSpec
name: mock-key
provider: openai
model: mock/replay
# The mock agent never calls a model; the spec only exists so llm_spec
# resolution has a key to find (the harbor adapter overrides it to "mock").
api_key_cmd: ["echo", "mock-key-not-used"]

---
kind: Experiment
name: tcbatch1-smoke

case_defaults:
  source: local

cases:
  - path: ../cyber-action-data-202605-accepted/tc_batch1/duckdb-3f0eb51-issue-526-t4
  - path: ../cyber-action-data-202605-accepted/tc_batch1/harfbuzz-ae860db-gpos-ligarray-oob-t4
  - path: ../cyber-action-data-202605-accepted/tc_batch1/exiv2-a14510a-issue-3443-t4

matrix:
  agents:
    - name: nop
    - name: oracle
    # the mock replays each case's packaged jobs/*/agent trail and runs the
    # solution -- instant, real reward, real artifacts. It exists so the whole
    # pipeline (pre -> gate -> run -> post -> ship) can be walked in minutes
    # without burning tokens; as a matrix entry it is plumbing, not a score.
    - name: mock
      llm_spec: mock-key
  trials: 1

concurrency: 2
max_attempts: 1

pipeline:
  per_case:
    # Say where we are before the gate can reject anything, so the log always
    # shows which case was rejected and which never got that far.
    - uses: announce_case
    - uses: admission
      with: {require: admitted, oracle_min_reward: 1.0, nop_max_reward: 0.0, trials: 1}

  per_trial:
    - uses: harbor
    - uses: redact
      with: {keys: required, ips: {traj: true, logs: false}}
    - uses: archive
      with: {format: zip}          # one zip per case, as the header describes

  per_experiment:
    - uses: dataset
    - uses: ship
      with:
        using: ship_onedrive
        dest: "testcase/{{.Experiment}}/{{.RunID}}"
      retries: 2                   # an upload really can fail transiently

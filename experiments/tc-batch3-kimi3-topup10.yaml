# kimi-k3 trajectory top-up for the LAST 2 batch3 cases short of 4
# trajectories on HF week3 (2026-09-06).
#
# Closes the final gap so every batch3 case reaches >=4 kimi trajectories.
# The other 32 batch3 cases already have >=4 (18 via tc-batch3-kimi3-x3,
# the rest via earlier top-ups / watch atomic ships, plus the 7 of these 9
# from topup9 that landed). These two lagged:
#
#   dovecot-d344c33-commit-b012cfb3-bin-t4      3 traj -> +1 -> 4
#   mariadb-e2088ce-commit-9749d71-t4           3 traj -> +1 -> 4
#
# dovecot's topup9 trial 3 was blocked by the leak gate: the kimi agent logs
# its proxy usage ("http://REDACTED_IP:12584") into the trajectory and the
# IP scrub left the :12584 port, tripping GATE_PATTERNS. adapters/
# materialize-forge-week2-trial.sh:_ip_spans now also consumes a trailing
# :port, so the endpoint masks as a unit and the gate passes. This top-up
# rerolls dovecot cleanly.
#
# HARD PRECONDITION satisfied: both cases already have their task tree on HF
# week3 (task/week3/<case>/ exists). ship_week2_trajectories writes ONLY
# under trajectory/<case>/ and assumes the task tree is present.
#
# Agent wiring: adapters/kimi3-rollout.sh runs `harbor run -c
# agent-ccbin-kimi3.yaml` (ClaudeCodeBinThirdParty, native claude binary
# uploaded to /usr/bin/claude, zero egress for agent setup, only the LLM
# proxy allowlisted). The adapter passes CLAUDE_CODE_PROMPT_VIA_STDIN=1 and
# --allow-agent-host for the proxy CIDR (injected at runtime).
#
# Ship: trajectories ONLY, per trial, via materialize_week2_trial +
# ship_week2_trajectories to hf_revision week3. Every completed rollout
# ships regardless of reward (2026-08-31 policy).
#
# Preconditions (env, sourced from the live watch PID at launch):
#   HF_TOKEN=...   (ship)
#   ANTHROPIC_*    (kimi proxy)
# Run:
#   ./rollout-man run experiments/tc-batch3-kimi3-topup10.yaml --commands experiments/commands.yaml
---
kind: LLMSpec
name: buglocation-llm
provider: anthropic
base_url: http://localhost:12584/tingly/anthropic
model: kimi-k3
api_key_env: ANTHROPIC_AUTH_TOKEN
---
kind: Experiment
name: tc-batch3-kimi3-topup10

case_defaults:
  source: local

# The two batch3 cases short of 4 trajectories on week3 as of 2026-09-06.
# Both already have their task tree on HF week3 (ship_week2_trajectories
# prerequisite).
cases:
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch3/dovecot-d344c33-commit-b012cfb3-bin-t4
  - path: /home/foo/project/cyber-action-data-202605-accepted/tc_batch3/mariadb-e2088ce-commit-9749d71-t4

matrix:
  agents:
    - name: forge-flow-fuzz
  trials: 2

# 2 cases x 2 trials = 4 harbor runs. concurrency 2 (only 2 cases); the
# watch is idle so contention is low. max_attempts 2 absorbs proxy-hiccup
# HOST_ERRORs at the command layer.
concurrency: 2
max_attempts: 2

pipeline:
  # Campaign-wide destination settings, declared once: every step's command
  # inherits these as env vars. week3 is the HF branch batch3 publishes to;
  # trajectory/ lives at the repo root next to task/ (task/week3 already
  # holds the cases from watch's atomic ships).
  with:
    hf_revision: week3
    hf_task_path: task/week3

  # No per_case steps: these are admitted cases with
  # solution/bug_location.json already written by watch's buglocate_kimi.
  per_case_concurrency: 2

  per_trial:
    - uses: rollout
      with: {using: kimi3_rollout}

    # No reward filter (2026-08-31 policy): every completed rollout ships.
    - uses: redact
      with: {keys: required, ips: {traj: true, logs: true}}

    # Trajectory-only materialization + sanitization + leak gate.
    - uses: materialize_week2_trial

    # CJK gate over exactly what this trial would ship; skip = this trial
    # cannot ship, the trajectory stays in OUT_DIR for manual triage.
    - uses: check_no_chinese_traj
      with: {traj_dir: "{{steps.materialize_week2_trial.outputs.trajectories_dir}}"}
      on_failure: skip

    # API-failure backstop over the same tree (poisoned/truncated
    # transcripts from proxy 429 fights must not reach the dataset).
    - uses: check_no_api_error_traj
      with: {traj_dir: "{{steps.materialize_week2_trial.outputs.trajectories_dir}}"}
      on_failure: skip

    - uses: ship
      with:
        using: ship_week2_trajectories
        path: "{{steps.materialize_week2_trial.outputs.trajectories_dir}}"
        dest: tinglydev/cyber-xianjin
        # hf_revision/hf_task_path come from pipeline.with above.

  per_experiment:
    - uses: record_progress
